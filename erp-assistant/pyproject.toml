[project]
name = "erp-assistant"
version = "0.1.0"
description = "Assistant harness for ERP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest]
testpaths = ["tests"]
pythonpath = ["."]

[tool.basedpyright]
venvPath = "."
venv = ".venv"

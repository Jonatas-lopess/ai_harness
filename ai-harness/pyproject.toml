[project]
name = "ai-harness"
version = "0.1.0"
description = "Domain-agnostic harness: tools, agent loop, tracing, evals. Packs plug in from outside."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.5",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.40.1",
    "pytest>=9.1.1",
]

[tool.pytest]
testpaths = ["tests"]
markers = ["integration"]

[tool.uv.build-backend]
module-name = "harness"

name: ci

on:
  push:
  pull_request:

# Simulated model only. Real Groq calls and Postgres stay out of CI:
# quota, nondeterminism and secrets (see erp-assistant/NOTES.md, phase 3 step 5).
jobs:
  ai-harness:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-harness
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # Sem o extra: o núcleo tem que funcionar sem o SDK do provedor (os testes do adaptador são pulados).
      - run: uv sync --locked
      - run: uv run pytest
      # Com o extra: testes do adaptador e typecheck do pacote inteiro.
      - run: uv sync --locked --extra groq
      - run: uv run pytest
      - run: uv run basedpyright

  erp-assistant:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: erp-assistant
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run pytest -m "not integration"
      - run: uv run python -m evals
      - run: uv run basedpyright
